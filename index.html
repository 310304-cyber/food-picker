<body class="min-h-screen flex items-center justify-center p-3 md:p-6 bg-night-950 select-none">

    <script>
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playClick() {
                this.init(); if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(580, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            },
            playPageFlip() {
                this.init(); if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.35, buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate), data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass';
                filter.frequency.setValueAtTime(200, this.ctx.currentTime); filter.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.15);
                const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.01, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime + 0.15);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination); noise.start();
            },
            playSpinTick() {
                this.init(); if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800 + Math.random() * 200, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.03);
            },
            playWinnerFanfare() {
                this.init(); if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.value = freq;
                    const startTime = this.ctx.currentTime + idx * 0.09;
                    gain.gain.setValueAtTime(0.2, startTime); gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(startTime); osc.stop(startTime + 0.4);
                });
            }
        };
    </script>

    <script>
        const defaultCategories = [
            { id: 'main', name: '正餐主食' },
            { id: 'snack', name: '宵夜小吃' },
            { id: 'sweet', name: '甜點飲料' }
        ];

        const defaultFoodDatabase = [
            { id: 1, name: '日式濃郁拉麵', category: 'main', icon: '🍜' },
            { id: 2, name: '義大利麵 / 披薩', category: 'main', icon: '🍕' },
            { id: 3, name: '熱騰騰麻辣火鍋', category: 'main', icon: '🍲' },
            { id: 4, name: '美式牛肉漢堡堡', category: 'main', icon: '🍔' },
            { id: 5, name: '日式定食 / 燒肉飯', category: 'main', icon: '🍱' },
            { id: 11, name: '台式宵夜鹹酥雞', category: 'snack', icon: '🍗' },
            { id: 12, name: '深夜日式居酒屋串燒', category: 'snack', icon: '🍢' },
            { id: 13, name: '現包湯包 / 水餃', category: 'snack', icon: '🥟' },
            { id: 17, name: '黑糖珍珠鮮奶茶', category: 'sweet', icon: '🧋' },
            { id: 18, name: '法式現烤可麗餅', category: 'sweet', icon: '🥞' },
            { id: 20, name: '提拉米蘇蛋糕', category: 'sweet', icon: '🍰' }
        ];

        let categories = [...defaultCategories];
        let foodDatabase = [...defaultFoodDatabase];

        let activeCategory = 'all';
        let managerFilterCategory = 'all';
        let isSpinning = false;

        window.onload = function() {
            renderCategoryTabs();
            updateItemCount();
        };

        /* 點擊按鈕觸發 3D 翻頁特效 */
        function triggerPageTurn() {
            AudioFX.playClick();
            AudioFX.playPageFlip();
            const coverPage = document.getElementById('coverPage');
            coverPage.classList.add('turning-page');
            setTimeout(() => {
                coverPage.style.display = 'none';
                updateItemCount();
            }, 1000);
        }

        function backToCover() {
            AudioFX.playClick();
            AudioFX.playPageFlip();
            const coverPage = document.getElementById('coverPage');
            coverPage.style.display = 'flex';
            coverPage.classList.remove('turning-page');
        }

        function renderCategoryTabs() {
            const container = document.getElementById('categoryTabs');
            const mobileContainer = document.getElementById('mobileCategoryTabs');
            const managerFilter = document.getElementById('managerFilterTabs');
            const selectOptions = document.getElementById('newItemCat');

            let tabsHTML = `<button onclick="setCategory('all')" id="cat-all" class="cat-btn px-3 py-1.5 rounded-lg font-medium ${activeCategory === 'all' ? 'text-white bg-brand-600' : 'text-gray-400'} whitespace-nowrap">全部</button>`;
            let mTabsHTML = `<button onclick="setCategory('all')" id="m-cat-all" class="cat-btn px-2.5 py-1 rounded-lg ${activeCategory === 'all' ? 'text-white bg-brand-600' : 'text-gray-400'} whitespace-nowrap">全部</button>`;
            let mFilterHTML = `<button onclick="setManagerFilter('all')" id="mfilter-all" class="mfilter-btn px-2 py-1 rounded-lg ${managerFilterCategory === 'all' ? 'text-white bg-brand-600' : 'text-gray-400'} whitespace-nowrap">全部</button>`;
            let selectHTML = `<option value="auto">✨ 自動判斷</option>`;

            categories.forEach(cat => {
                const isAct = activeCategory === cat.id;
                tabsHTML += `<button onclick="setCategory('${cat.id}')" id="cat-${cat.id}" class="cat-btn px-3 py-1.5 rounded-lg font-medium ${isAct ? 'text-white bg-brand-600' : 'text-gray-400'} whitespace-nowrap">${cat.name}</button>`;
                mTabsHTML += `<button onclick="setCategory('${cat.id}')" id="m-cat-${cat.id}" class="cat-btn px-2.5 py-1 rounded-lg ${isAct ? 'text-white bg-brand-600' : 'text-gray-400'} whitespace-nowrap">${cat.name}</button>`;
                mFilterHTML += `<button onclick="setManagerFilter('${cat.id}')" id="mfilter-${cat.id}" class="mfilter-btn px-2 py-1 rounded-lg ${managerFilterCategory === cat.id ? 'text-white bg-brand-600' : 'text-gray-400'} whitespace-nowrap">${cat.name}</button>`;
                selectHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });

            container.innerHTML = tabsHTML;
            mobileContainer.innerHTML = mTabsHTML;
            managerFilter.innerHTML = mFilterHTML;
            selectOptions.innerHTML = selectHTML;

            renderCategoryManagerPills();
        }

        function renderCategoryManagerPills() {
            const catList = document.getElementById('categoriesList');
            catList.innerHTML = '';
            categories.forEach(cat => {
                const pill = document.createElement('div');
                pill.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/10 text-xs text-gray-200 border border-white/5';
                pill.innerHTML = `
                    <span>${cat.name}</span>
                    <button onclick="deleteCategory('${cat.id}')" class="text-gray-400 hover:text-red-400 ml-1">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                `;
                catList.appendChild(pill);
            });
        }

        function addNewCategory() {
            const input = document.getElementById('newCatInput');
            const name = input.value.trim();
            if (!name) return;
            const newId = 'cat_' + Date.now();
            categories.push({ id: newId, name: name });
            input.value = '';
            renderCategoryTabs();
            AudioFX.playClick();
        }

        function deleteCategory(catId) {
            if (categories.length <= 1) {
                alert('至少需保留一個主題分類！');
                return;
            }
            if (confirm('刪除類別將同步清除該類別下的美食項目，確定嗎？')) {
                categories = categories.filter(c => c.id !== catId);
                foodDatabase = foodDatabase.filter(f => f.category !== catId);
                if (activeCategory === catId) activeCategory = 'all';
                renderCategoryTabs();
                renderMenuItems();
                updateItemCount();
                AudioFX.playClick();
            }
        }

        function setCategory(cat) {
            AudioFX.playClick();
            activeCategory = cat;
            renderCategoryTabs();
            updateItemCount();
        }

        function getFilteredItems() {
            if (activeCategory === 'all') return foodDatabase;
            return foodDatabase.filter(item => item.category === activeCategory);
        }

        function updateItemCount() {
            document.getElementById('itemCount').innerText = getFilteredItems().length;
        }

        function startDraw() {
            if (isSpinning) return;
            const items = getFilteredItems();
            if (items.length === 0) {
                alert('目前選定的類別下沒有食物，請先新增食物！');
                return;
            }

            isSpinning = true;
            AudioFX.playClick();

            const slotDisplay = document.getElementById('slotDisplay');
            slotDisplay.innerHTML = `
                <span id="slotIcon" class="text-5xl md:text-6xl text-brand-500 mb-2">🥣</span>
                <div id="slotTitle" class="text-3xl md:text-4xl font-extrabold text-white tracking-wide">抽取中...</div>
                <span id="slotTag" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-white/10 text-brand-400">進行中</span>
            `;

            let counter = 0;
            const totalRounds = 25;
            const interval = setInterval(() => {
                counter++;
                const randomItem = items[Math.floor(Math.random() * items.length)];
                document.getElementById('slotIcon').innerText = randomItem.icon;
                document.getElementById('slotTitle').innerText = randomItem.name;
                document.getElementById('slotTag').innerText = getCategoryName(randomItem.category);
                AudioFX.playSpinTick();

                if (counter >= totalRounds) {
                    clearInterval(interval);
                    isSpinning = false;
                    AudioFX.playWinnerFanfare();
                    fireConfetti();
                }
            }, 60);
        }

        function startComboDraw() {
            if (isSpinning) return;
            if (categories.length === 0) return;

            const validCategories = categories.filter(cat => foodDatabase.some(item => item.category === cat.id));
            if (validCategories.length === 0) {
                alert('菜單庫中沒有足夠的美食項目可以進行全餐抽取！');
                return;
            }

            isSpinning = true;
            AudioFX.playClick();

            const slotDisplay = document.getElementById('slotDisplay');
            slotDisplay.innerHTML = `<div class="text-white text-lg font-bold">🍱 正在為您組合全餐選單...</div>`;

            let counter = 0;
            const interval = setInterval(() => {
                counter++;
                AudioFX.playSpinTick();

                if (counter >= 18) {
                    clearInterval(interval);
                    isSpinning = false;
                    
                    let comboHTML = `<div class="w-full text-left space-y-2">
                        <div class="text-center text-xs font-bold text-amber-400 uppercase tracking-wider mb-2">✨ 今日全餐大滿貫推薦 ✨</div>`;
                    
                    validCategories.forEach(cat => {
                        const catItems = foodDatabase.filter(f => f.category === cat.id);
                        const picked = catItems[Math.floor(Math.random() * catItems.length)];
                        comboHTML += `
                            <div class="flex items-center justify-between p-2 rounded-xl bg-white/5 border border-white/10">
                                <span class="text-xs text-brand-400 font-semibold">[${cat.name}]</span>
                                <span class="text-sm font-bold text-white">${picked.icon} ${picked.name}</span>
                            </div>
                        `;
                    });
                    comboHTML += `</div>`;
                    
                    slotDisplay.innerHTML = comboHTML;
                    AudioFX.playWinnerFanfare();
                    fireConfetti();
                }
            }, 70);
        }

        function getCategoryName(catId) {
            const found = categories.find(c => c.id === catId);
            return found ? found.name : '美食推薦';
        }

        function fireConfetti() {
            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 }, colors: ['#f97316', '#fbbf24', '#ffffff'] });
        }

        function toggleMenuManager() {
            AudioFX.playClick();
            const modal = document.getElementById('menuModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                renderMenuItems();
            }
        }

        function setManagerFilter(cat) {
            managerFilterCategory = cat;
            renderCategoryTabs();
            renderMenuItems();
        }

        function renderMenuItems() {
            const grid = document.getElementById('itemsGrid');
            const searchKey = document.getElementById('searchMenuInput').value.trim().toLowerCase();
            grid.innerHTML = '';

            let filtered = foodDatabase.filter(item => {
                const matchCat = managerFilterCategory === 'all' || item.category === managerFilterCategory;
                const matchSearch = item.name.toLowerCase().includes(searchKey);
                return matchCat && matchSearch;
            });

            document.getElementById('managerResultCount').innerText = `顯示 ${filtered.length} / 共 ${foodDatabase.length} 個`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-4 text-gray-500 text-xs">沒有符合的菜單項目</div>`;
                return;
            }

            filtered.forEach(item => {
                const chip = document.createElement('div');
                chip.className = 'flex items-center justify-between p-2 rounded-xl bg-white/5 border border-white/10 text-xs text-gray-200';
                chip.innerHTML = `
                    <span class="truncate">${item.icon} ${item.name}</span>
                    <button onclick="deleteItem(${item.id})" class="text-gray-500 hover:text-red-400 ml-1.5 p-1 transition-colors">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                grid.appendChild(chip);
            });
        }

        function addCustomItem() {
            const input = document.getElementById('newItemInput');
            const select = document.getElementById('newItemCat');
            const name = input.value.trim();

            if (!name) return;

            let cat = select.value;
            if (cat === 'auto') {
                cat = categories.length > 0 ? categories[0].id : 'main';
            }

            const icons = ['🍱', '🍲', '🍔', '🍕', '🥟', '🍜', '🍣', '🍰', '🧋', '🥐'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];

            foodDatabase.push({
                id: Date.now(),
                name: name,
                category: cat,
                icon: randomIcon
            });

            input.value = '';
            renderMenuItems();
            updateItemCount();
            AudioFX.playClick();
        }

        function deleteItem(id) {
            foodDatabase = foodDatabase.filter(item => item.id !== id);
            renderMenuItems();
            updateItemCount();
            AudioFX.playClick();
        }

        function resetHistory() {
            if (confirm('確定要將菜單還原為預設設定嗎？（自訂項目將會清除）')) {
                categories = [...defaultCategories];
                foodDatabase = [...defaultFoodDatabase];
                activeCategory = 'all';
                managerFilterCategory = 'all';
                renderCategoryTabs();
                renderMenuItems();
                updateItemCount();
                AudioFX.playClick();
            }
        }
    </script>
</body>
</html>
